<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Generator Zadań</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f5f5f7; }
        .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 360px; }
        h2 { margin-top: 0; color: #1d1d1f; font-size: 22px; }
        label { display: block; margin: 15px 0 5px; color: #86868b; font-size: 14px; }
        input { width: 100%; padding: 10px; border: 1px solid #d2d2d7; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
        button { width: 100%; margin-top: 20px; padding: 12px; background: #0066cc; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 500; cursor: pointer; }
        button:hover { background: #0055b3; }
        .response { margin-top: 20px; padding: 12px; border-radius: 8px; font-size: 14px; display: none; }
        .success { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
        .error { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Zleć nowe zadanie</h2>
        
        <label for="sleepTime">Czas przetwarzania (ms):</label>
        <input type="number" id="sleepTime" value="3000">

        <button onclick="submitTask()">Zleć zadanie</button>

        <div id="output" class="response"></div>
    </div>

    <script>
        async function submitTask() {
            const sleepTime = document.getElementById('sleepTime').value;
            const output = document.getElementById('output');
            
            output.style.display = 'none';

            try {
                const response = await fetch(`/api/task?sleepTime=${sleepTime}`, { method: 'POST' });
                const message = await response.text();

                if (response.ok) {
                    output.className = 'response success';
                    output.innerHTML = `<strong>Status ${response.status} (Accepted)</strong><br>${message}`;
                } else {
                    output.className = 'response error';
                    output.innerText = `Błąd: ${response.status}`;
                }
            } catch (err) {
                output.className = 'response error';
                output.innerText = 'Błąd połączenia z serwerem.';
            }

            output.style.display = 'block';
        }
    </script>

</body>
</html>
