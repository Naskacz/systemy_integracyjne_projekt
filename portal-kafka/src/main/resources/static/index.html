<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zarządzanie Zadaniami - Kafka</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; gap: 20px; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f5f5f7; }
        .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 380px; }
        h2 { margin-top: 0; color: #1d1d1f; font-size: 22px; }
        label { display: block; margin: 15px 0 5px; color: #86868b; font-size: 14px; }
        input { width: 100%; padding: 10px; border: 1px solid #d2d2d7; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
        button { width: 100%; margin-top: 20px; padding: 12px; background: #0066cc; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 500; cursor: pointer; }
        button:hover { background: #0055b3; }
        .response { margin-top: 20px; padding: 12px; border-radius: 8px; font-size: 14px; background: #eef2f5; display: none; }
        .success { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
        .error { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }
    </style>
</head>
<body>

    <!-- Pierwsze okno: Pojedyncze zadanie ze śledzeniem statusu -->
    <div class="card">
        <h2>Zleć nowe zadanie</h2>
        
        <label for="sleepTime">Czas przetwarzania (ms):</label>
        <input type="number" id="sleepTime" value="4000">

        <button onclick="submitTask()">Zleć zadanie</button>

        <div id="output" class="response"></div>
    </div>

    <!-- Drugie okno: Masowe zlecanie zadań do testów HPA -->
    <div class="card">
        <h2>Masowe zlecanie zadań</h2>
        
        <label for="taskCount">Liczba zapytań:</label>
        <input type="number" id="taskCount" value="50">

        <button onclick="submitMultipleTasks()">Wyślij masowo</button>

        <div id="bulkOutput" class="response"></div>
    </div>

    <script>
        async function submitTask() {
            const sleepTime = document.getElementById('sleepTime').value;
            const output = document.getElementById('output');
            
            output.style.display = 'block';
            output.className = 'response';
            output.innerHTML = "Wysyłanie żądania...";

            try {
                const response = await fetch(`/api/task?sleepTime=${sleepTime}`, { method: 'POST' });
                const taskId = await response.text();

                if (response.ok) {
                    output.innerHTML = `<strong>Zadanie przyjęte!</strong><br>ID: <small>${taskId}</small><br>Status: <span id="status-${taskId}" style="font-weight:bold; color:#0066cc;">OCZEKUJE...</span>`;
                    
                    const interval = setInterval(async () => {
                        const statusRes = await fetch(`/api/task/${taskId}/status`);
                        const status = await statusRes.text();
                        
                        const statusSpan = document.getElementById(`status-${taskId}`);
                        if (statusSpan) {
                            statusSpan.innerText = status;
                            
                            if (status === "ZAKOŃCZONE") {
                                statusSpan.style.color = "#2e7d32";
                                clearInterval(interval);
                            } else if (status === "BŁĄD") {
                                statusSpan.style.color = "#c62828";
                                clearInterval(interval);
                            }
                        }
                    }, 1000);

                } else {
                    output.className = 'response error';
                    output.innerText = `Błąd serwera: ${response.status}`;
                }
            } catch (err) {
                output.className = 'response error';
                output.innerText = 'Błąd połączenia z serwerem.';
            }
        }

        async function submitMultipleTasks() {
            const count = parseInt(document.getElementById('taskCount').value, 10) || 0;
            const sleepTime = document.getElementById('sleepTime').value || 4000;
            const bulkOutput = document.getElementById('bulkOutput');

            bulkOutput.style.display = 'block';
            bulkOutput.className = 'response';
            bulkOutput.innerText = `Wysyłanie ${count} zadań...`;

            const requests = [];
            for (let i = 0; i < count; i++) {
                requests.push(fetch(`/api/task?sleepTime=${sleepTime}`, { method: 'POST' }));
            }

            try {
                await Promise.all(requests);
                bulkOutput.className = 'response success';
                bulkOutput.innerHTML = `<strong>Pomyślnie wysłano ${count} zadań!</strong><br>HPA zacznie je przetwarzać.`;
            } catch (err) {
                bulkOutput.className = 'response error';
                bulkOutput.innerText = 'Wystąpił błąd podczas masowego wysyłania.';
            }
        }
    </script>

</body>
</html>
