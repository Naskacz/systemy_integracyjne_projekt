apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-kafka-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portal-kafka
  template:
    metadata:
      labels:
        app: portal-kafka
    spec:
      containers:
      - name: portal-kafka
        image: portal-kafka:latest
        imagePullPolicy: IfNotPresent 
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: "host.docker.internal:9092" 
        - name: SPRING_DATA_REDIS_HOST
          value: "redis-service"
        - name: SPRING_DATA_REDIS_PORT
          value: "6379"
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: portal-kafka-service
spec:
  type: NodePort
  selector:
    app: portal-kafka
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
---
apiVersion: autoscaling/v1
kind: HorizontalPodAutoscaler
metadata:
  name: portal-kafka-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: portal-kafka-app
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 50